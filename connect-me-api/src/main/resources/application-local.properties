spring.datasource.url=jdbc:mysql://localhost:3307/connectme?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=connectme
spring.datasource.password=connectme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

websocket.allowed-origins=http://localhost:3000